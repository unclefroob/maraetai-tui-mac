[package]
name = "maraetai-common"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "maraetai_common"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
directories.workspace = true
md-5.workspace = true
thiserror.workspace = true
rand.workspace = true
libc = "0.2"

# keyring's credential-store backend is a per-platform choice, so it's
# declared per-target rather than as one shared dependency:
#
# Linux: sync-secret-service (GNOME Keyring/KWallet over D-Bus) — the real
# backend, matching Entry's synchronous API used throughout this project.
# crypto-rust avoids a system OpenSSL dependency for its encryption layer.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# macOS: apple-native (the system Keychain via the security-framework
# crate) — a completely different backend, since there's no D-Bus/Secret
# Service on macOS at all.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"
